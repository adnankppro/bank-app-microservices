spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: authentication
              uri: lb://authentication
              predicates:
                - Path=/auth/**, /users/**, /admins/**

            - id: branch
              uri: lb://branch-service
              predicates:
                - Path=/branches/**

            - id: profile
              uri: lb://profile-service
              predicates:
                - Path=/profiles/**

            - id: banking
              uri: lb://banking
              predicates:
                - Path=/accounts/**, /transactions/**


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

