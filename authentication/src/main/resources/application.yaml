spring:
  application:
    name: authentication

  data:
    redis:
      host: localhost
      port: 6379


  datasource:
    url: jdbc:postgresql://localhost:5432/user_db
    username: admin
    password: secret
    hikari:
      data-source-properties:
        serverTimeZone: Asia/Kolkata

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8081
